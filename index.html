<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Задание 5 — управление объектом в AR</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
<div id="overlay">
<p id="status" role="status"></p>
<section id="panel" aria-label="Управление объектом">
<div class="row"><label>Форма<select id="model"><option value="cube">Куб</option><option value="sphere">Сфера</option><option value="torus">Тор</option></select></label><label>Цвет<input id="color" type="color" value="#e85d3a"></label></div>
<div class="row"><button id="left" aria-label="Повернуть влево">↶ −15°</button><button id="right" aria-label="Повернуть вправо">↷ +15°</button><button id="spin" aria-pressed="false">Автоповорот</button></div>
<label class="slider">Шероховатость<input id="roughness" type="range" min="0" max="1" step="0.01" value="0.35"></label>
<label class="slider">Металличность<input id="metalness" type="range" min="0" max="1" step="0.01" value="0.45"></label>
<div class="row"><button id="launch" class="primary">Открыть AR</button><button id="exit" hidden>Выйти из AR</button></div>
</section>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
